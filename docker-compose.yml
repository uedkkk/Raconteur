services:
  raconteur:
    image: ghcr.io/uedkkk/raconteur:latest
    # build: .  # Uncomment to build locally instead of pulling from registry
    volumes:
      - ./data:/app/data
    environment:
      - NUXT_STORAGE_PROVIDER=local
      # - NUXT_SESSION_PASSWORD=  # Auto-generated and persisted to data/.session-password if not set
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./data/storage:/app/data/storage:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - raconteur
    restart: unless-stopped
