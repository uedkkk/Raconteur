proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=30d;

server {
    listen 80;
    client_max_body_size 100m;

    # Static files served directly by Nginx (images, videos, etc.)
    location /storage/ {
        alias /app/data/storage/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        open_file_cache max=1000 inactive=5m;
        open_file_cache_valid 5m;
        open_file_cache_min_uses 2;
    }

    # Static assets (fonts, JS, CSS) cached by Nginx
    location ~* \.(woff2?|ttf|otf|eot|js|css|png|jpg|jpeg|webp|gif|svg|ico)$ {
        proxy_pass http://raconteur:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache static_cache;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # All other requests proxied to Node.js
    location / {
        proxy_pass http://raconteur:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
